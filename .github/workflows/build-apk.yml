name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK build variant'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build-apk:
    name: Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit and Robolectric tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' }}
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload Debug APK artifact
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: SweepPulse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build Release APK
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_type == 'release') || (secrets.RELEASE_KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '') }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Missing signing secrets. Set RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD in repository secrets."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          gradle :app:assembleRelease --no-daemon

      - name: Upload Release APK artifact
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_type == 'release') || (secrets.RELEASE_KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '') }}
        uses: actions/upload-artifact@v4
        with:
          name: SweepPulse-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
